<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
  </head>
  <body{% if page.url == "/" %} class="page-home"{% endif %}>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="ZeroVolt home">
          <span class="brand-mark">0V</span>
          <span>ZeroVolt</span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="https://www.linkedin.com/in/domenico-crupi/">LinkedIn</a>
          <a href="mailto:hello@zerovolt.it">Email</a>
        </nav>
      </div>
    </header>

    <main id="content" class="site-main">
      <div class="shell content-shell">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>ZeroVolt · Engineering notes by Domenico Crupi</p>
        <p>
          <a href="mailto:hello@zerovolt.it">hello@zerovolt.it</a>
          <span aria-hidden="true">·</span>
          <a href="https://www.linkedin.com/in/domenico-crupi/">LinkedIn</a>
        </p>
      </div>
    </footer>
  </body>
</html>
